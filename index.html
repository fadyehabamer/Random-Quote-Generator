<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Random quote generator: get an inspiring quote at the click of a button and share it on X.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" referrerpolicy="no-referrer" crossorigin="anonymous" />
    <title>Quote Generator</title>
</head>
<body>
    <div class="container">
        <i class="fas fa-quote-left" aria-hidden="true"></i>
        <h2 class="quote" aria-live="polite"></h2>
        <hr>
        <p class="author"></p>
        <div class="buttons">
            <a class="twitter-share-button" href="https://x.com/intent/post" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i>Share on X</a>
            <button type="button" class="copy" disabled><i class="fa-regular fa-copy" aria-hidden="true"></i><span class="copy-label">Copy</span></button>
            <button type="button" class="next" aria-label="Next quote" aria-keyshortcuts="Space N">Next</button>
        </div>
        <p class="shortcut-hint">Press <kbd>Space</kbd> or <kbd>N</kbd> for a new quote</p>
        <p class="sr-only copy-status" role="status"></p>
    </div>
    <div class="loader hide" role="status">
        <img src="loader.svg" alt="">
        <span class="loader-text">Loading quote...</span>
    </div>
    <script src="main.js"></script>
</body>
</html>
